<div class="ms-auto">
  <div class="d-inline-block dropdown">
    <button
      class="btn p-0 bg-transparent border-0"
      type="button"
      id="userMenuButton"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      <div class="user-avatar">
        {{ initials }}
      </div>
    </button>

    <ul class="dropdown-menu dropdown-menu-end user-menu" aria-labelledby="userMenuButton">
      <li class="px-3 py-3">
        <div class="d-flex align-items-center gap-3">
          <div class="user-avatar-lg">{{ initials }}</div>
          <div>
            <strong class="d-block fs-6">{{ username }}</strong>
            <span class="text-muted small d-block">{{ email }}</span>
          </div>
        </div>
      </li>

      <li><hr class="dropdown-divider my-1" /></li>

      <li class="px-3 py-2">
        <div class="d-flex align-items-center gap-2 small">
          <i class="bi bi-geo-alt text-muted"></i>
          <span class="text-muted">Country:</span>
          <span class="fw-medium">{{ country || 'Not set' }}</span>
        </div>
        <div class="d-flex align-items-center gap-2 small mt-2">
          <i class="bi bi-currency-exchange text-muted"></i>
          <span class="text-muted">Currency:</span>
          <span class="fw-medium">{{ currency }}</span>
        </div>
      </li>

      <li><hr class="dropdown-divider my-1" /></li>

      <li>
        <button class="dropdown-item user-menu-item edit-item" type="button" (click)="openEditModal()">
          <i class="bi bi-pencil me-2"></i>Edit Profile
        </button>
      </li>
      <li>
        <button class="dropdown-item user-menu-item logout-item" type="button" (click)="onLogout()">
          <i class="bi bi-box-arrow-right me-2"></i>Logout
        </button>
      </li>
    </ul>
  </div>
</div>

@if (showEditModal) {
  <div class="modal-overlay" (click.self)="closeEditModal()">
    <div class="modal-dialog-custom" role="dialog" aria-modal="true" aria-labelledby="editProfileTitle">
      <div class="modal-header-custom d-flex justify-content-between align-items-center">
        <h5 class="modal-title" id="editProfileTitle">Edit Profile</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeEditModal()"></button>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="onSave()">
        <div class="modal-body-custom">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" formControlName="username" readonly />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" formControlName="email" readonly />
          </div>

          <div class="mb-3">
            <label class="form-label">Country</label>
            <ng-select
              [items]="countries"
              bindLabel="name"
              formControlName="country"
              [searchable]="true"
              [clearable]="true"
              placeholder="Select your country"
              (change)="onCountryChange()"
            >
              <ng-template ng-option-tmp let-item="item">
                <div class="d-flex justify-content-between align-items-center">
                  <span>{{ item.name }}</span>
                  <span class="badge text-bg-light ms-3">{{ item.currency }}</span>
                </div>
              </ng-template>
            </ng-select>
          </div>

          <div class="mb-3">
            <label class="form-label">Currency</label>
            <input
              type="text"
              class="form-control"
              formControlName="currency"
              placeholder="e.g. $"
            />
          </div>

          @if (errorMessage) {
            <div class="alert alert-danger py-2 small mb-3">{{ errorMessage }}</div>
          }
        </div>

        <div class="modal-footer-custom d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" (click)="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="isSaving">
            @if (isSaving) {
              <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            }
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
}
