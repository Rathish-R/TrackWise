<div class="app-shell d-flex flex-column vh-100">
  <nav class="topbar navbar navbar-dark px-4">
    <span class="navbar-brand fw-semibold mb-0">
      <i class="bi bi-wallet2 me-2"></i>Track Wise
    </span>
    <div class="ms-auto dropdown">
      <button
        class="btn btn-sm btn-outline-light dropdown-toggle"
        type="button"
        id="userMenuButton"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <i class="bi bi-person-circle me-1"></i>{{ username }}
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuButton">
        <li class="px-3 py-2">
          <strong>{{ username }}</strong>
          <div class="text-muted small">Signed in</div>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li class="dropdown-item-text">
          <div><strong>User Details</strong></div>
          <div class="small text-muted">Email: {{ email }}</div>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button class="dropdown-item text-danger" type="button" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="content-area d-flex flex-grow-1 overflow-hidden">
    <aside class="sidebar d-flex flex-column p-3 gap-2">
      <a class="sidebar-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="bi bi-grid-1x2"></i>
        <span>Dashboard</span>
      </a>
      <a class="sidebar-link" routerLink="/expenses" routerLinkActive="active">
        <i class="bi bi-list-ul"></i>
        <span>Expenses</span>
      </a>
      <a class="sidebar-link" routerLink="/categories" routerLinkActive="active">
        <i class="bi bi-grid"></i>
        <span>Expense Category</span>
      </a>
    </aside>

    <main class="main-content p-4 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
