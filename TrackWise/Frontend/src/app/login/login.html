<div class="login-page d-flex align-items-center justify-content-center">
  <div class="card shadow login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-wallet2 fs-1 text-primary"></i>
        <h3 class="mb-0 mt-2 fw-semibold">Track Wise</h3>
        <p class="text-muted mb-0">
          @if (mode === 'login') {
            Sign in to your account
          } @else {
            Create a new account
          }
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            formControlName="username"
            placeholder="Enter username"
            autocomplete="username"
          />
        </div>

        @if (mode === 'signup') {
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter email"
              autocomplete="email"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Country</label>
            <select class="form-select" formControlName="country">
              <option value="" disabled selected>Select your country</option>
              @for (country of countries; track country) {
                <option [value]="country">{{ country }}</option>
              }
            </select>
          </div>
        }

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
            autocomplete="current-password"
          />
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger py-2 small mb-3">{{ errorMessage }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
          {{ submitting ? 'Please wait...' : mode === 'login' ? 'Sign In' : 'Sign Up' }}
        </button>
      </form>

      <div class="text-center mt-3 small text-muted">
        @if (mode === 'login') {
          Don't have an account?
          <a href="javascript:void(0)" (click)="switchMode('signup')" class="fw-semibold">Sign up</a>
        } @else {
          Already have an account?
          <a href="javascript:void(0)" (click)="switchMode('login')" class="fw-semibold">Sign in</a>
        }
      </div>
    </div>
  </div>
</div>
